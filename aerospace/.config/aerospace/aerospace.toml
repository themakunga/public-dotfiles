# AeroSpace config — Tokyo Night palette, Hyprland-style workspaces

start-at-login = true

[gaps]
inner.horizontal = 6
inner.vertical   = 6
outer.left       = 4
outer.bottom     = 4
outer.top        = 4
outer.right      = 4

[mode.main.binding]
# Focus — alt + hjkl
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Move window — alt + shift + hjkl
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Resize — alt + ctrl + hjkl
alt-ctrl-h = 'resize width -50'
alt-ctrl-j = 'resize height +50'
alt-ctrl-k = 'resize height -50'
alt-ctrl-l = 'resize width +50'

# Layouts
alt-slash     = 'layout tiles horizontal vertical'
alt-shift-slash = 'layout accordion horizontal vertical'

# Float toggle
alt-shift-space = 'layout floating tiling'

# Fullscreen
alt-f = 'fullscreen'

# Reload config
alt-shift-semicolon = 'reload-config'

# Workspaces 1–9 — alt + number
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# Move window to workspace — alt + shift + number
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'

# Cycle workspaces
alt-left      = 'workspace prev --wrap-around'
alt-right     = 'workspace next --wrap-around'
alt-tab       = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

[[on-window-detected]]
if.app-name-regex-substring = 'System Settings|Calendar|App Store|Calculator'
run = 'layout floating'
