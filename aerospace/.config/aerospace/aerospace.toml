# AeroSpace config — Tokyo Night palette, Hyprland-style workspaces

start-at-login = true

[gaps]
inner.horizontal = 6
inner.vertical = 6
outer.left = 4
outer.bottom = 4
outer.top = 4
outer.right = 4

[mode.main.binding]
# Focus — alt + hjkl
alt-h = "focus left"
alt-j = "focus down"
alt-k = "focus up"
alt-l = "focus right"

# Resize — alt + shift + hjkl
alt-shift-h = "resize width -50"
alt-shift-j = "resize height +50"
alt-shift-k = "resize height -50"
alt-shift-l = "resize width +50"

# Layouts
alt-slash = "layout tiles horizontal vertical"
alt-shift-slash = "layout accordion horizontal vertical"

# Float toggle
alt-shift-space = "layout floating tiling"

# Fullscreen
alt-f = "fullscreen"

# Reload config
alt-shift-semicolon = "reload-config"

# Rotate position in workspace (cycle tiling axis)
alt-shift-o = "layout tiles horizontal vertical"

# Split below — active app below previous, half space
alt-shift-x = "join-with down"

# Split right — active app to the right of previous, half space
alt-shift-v = "join-with right"

# Workspaces 1–5 — alt + number
alt-1 = "workspace 1"
alt-2 = "workspace 2"
alt-3 = "workspace 3"
alt-4 = "workspace 4"
alt-5 = "workspace 5"

# Move window to workspace (current monitor) — alt + shift + number
alt-shift-1 = "move-node-to-workspace 1"
alt-shift-2 = "move-node-to-workspace 2"
alt-shift-3 = "move-node-to-workspace 3"
alt-shift-4 = "move-node-to-workspace 4"
alt-shift-5 = "move-node-to-workspace 5"

# Cycle workspaces on current monitor
alt-shift-left = "workspace prev --wrap-around"
alt-shift-right = "workspace next --wrap-around"

# Switch monitor above / below (no-op if only one monitor)
alt-shift-up = "focus-monitor up"
alt-shift-down = "focus-monitor down"

# Move app to the other monitor (no-op if only one monitor)
alt-shift-m = "move-node-to-monitor --wrap-around next"

# Back and forth
alt-tab = "workspace-back-and-forth"

[[on-window-detected]]
if.app-name-regex-substring = "System Settings|Calendar|App Store|Calculator"
run = "layout floating"
