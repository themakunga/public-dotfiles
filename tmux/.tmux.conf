# ==============================================================================
# TMUX CONFIGURATION
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. GENERAL SETTINGS
# ------------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g mouse on
set -g set-clipboard on
set -g extended-keys on
set -ga terminal-features "*:extkeys"
set -g allow-passthrough on   # kitty graphics protocol via wezterm+tmux (snacks.image)

# Change from 0 based to 1 based because keyboard layout
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# ------------------------------------------------------------------------------
# 2. KEYBINDINGS
# ------------------------------------------------------------------------------
# Prefix
unbind C-b
set -g prefix C-s
unbind C-s  # liberado: tmux-which-key lo usa para prefix_table: C-s

# Reload config
unbind r
bind r source-file $HOME/.tmux.conf \; display-message "Config reloaded!"

# Liberar S-Up del prefix (tmux-sensible lo ocupa como refresh-client)
unbind -T prefix S-Up

# Keystroke display pane (prefix + K) — toggle
bind K run-shell '\
  pane=$(tmux list-panes -F "#{pane_id} #{pane_title}" | awk "/keyshow/{print \$1}"); \
  if [ -n "$pane" ]; then \
    tmux kill-pane -t "$pane"; \
  else \
    tmux split-window -v -l 3 -d "$HOME/.config/tmux/keyshow.py"; \
    tmux select-pane -t "bottom" \; select-pane -T "keyshow" \; select-pane -l; \
  fi'

# Vim like pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Splitting windows
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# Alt+hjkl to switch panes (vim-style)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Alt+number to select window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Shift+Arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Alt+Arrow to resize panes
bind -n M-Left  resize-pane -L 5
bind -n M-Right resize-pane -R 5
bind -n M-Up    resize-pane -U 5
bind -n M-Down  resize-pane -D 5

# Vim-like copy/paste
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

# ------------------------------------------------------------------------------
# 3. TOKYO NIGHT MOON - MODERN BUBBLE THEME
# ------------------------------------------------------------------------------
thm_bg="#222436"
thm_fg="#c8d3f5"
thm_cyan="#86e1fc"
thm_black="#1b1d2b"
thm_gray="#3a3f5a"
thm_magenta="#c099ff"
thm_pink="#ff757f"
thm_red="#ff757f"
thm_green="#c3e88d"
thm_yellow="#ffc777"
thm_blue="#82aaff"
thm_orange="#ff9e64"
thm_black4="#444a73"

set-option -g status-position bottom
set -g status "on"
set -g status-bg "${thm_bg}"
set -g status-justify "absolute-centre"
set -g status-left-length "100"
set -g status-right-length "100"

set -g message-style "fg=${thm_cyan},bg=${thm_black4},align=centre"
set -g message-command-style "fg=${thm_cyan},bg=${thm_black4},align=centre"

# Heavy dividers make the active pane stand out against inactive panes.
set -g pane-border-lines heavy
set -g pane-border-style "fg=${thm_gray}"
set -g pane-active-border-style "fg=${thm_blue},bold"

set -g window-status-activity-style "fg=${thm_fg},bg=${thm_bg},none"
set -g window-status-separator ""
set -g window-status-style "fg=${thm_fg},bg=${thm_bg},none"

set -g clock-mode-colour "${thm_blue}"
set -g mode-style "fg=${thm_blue} bg=${thm_black4} bold"

# Restore the native layout: expands window formats and preserves mouse ranges.
# Unset explicitly so reloading also removes the previous custom layout.
set -gu status-format

# Left: vacio (modo/sesion viven en lualine)
set -g status-left ""
set -g status-left-length 0

# Right: Prefix Indicator + Current Directory
set -g status-right "#{?client_prefix,#[fg=${thm_red}]#[bg=${thm_red}]#[fg=${thm_bg},bold] PREFIX #[fg=${thm_red}]#[bg=${thm_bg},nobold] ,}#[fg=${thm_magenta},bg=${thm_bg}]#[fg=${thm_bg},bg=${thm_magenta},bold]󰉖 #(echo '#{pane_current_path}' | rev | cut -d'/' -f-2 | rev) #[fg=${thm_magenta},bg=${thm_bg},nobold]"

# Center: Inactive Window
set -g window-status-format "#[fg=${thm_gray},bg=${thm_bg}] #[fg=${thm_fg},bg=${thm_gray}]#I #[fg=${thm_fg},bg=${thm_gray}]#W#[fg=${thm_gray},bg=${thm_bg}] "

# Center: Active Window
set -g window-status-current-format "#[fg=${thm_green},bg=${thm_bg}] #[fg=${thm_bg},bg=${thm_green},bold]#I #[fg=${thm_bg},bg=${thm_green},bold]#W#[fg=${thm_green},bg=${thm_bg},nobold] "

# ------------------------------------------------------------------------------
# 4. PLUGINS
# ------------------------------------------------------------------------------
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Fuzzy Session Manager (tmux-sessionx)
# Requires fzf and bat installed in your system
set -g @plugin 'omerxx/tmux-sessionx'
# SessionX config
set -g @sessionx-bind 'o'          # Prefix + o to open the fuzzy session manager
set -g @sessionx-zoxide-mode 'on'  # Enable zoxide integration if available
set -g @sessionx-fzf-builtin-tmux 'on'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'

set -g @plugin 'alexwforsythe/tmux-which-key'

set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'


set-option -g focus-events on
