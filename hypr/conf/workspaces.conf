# ─────────────────────────────────────────────────────────────────────────────
# Workspaces — aperture-science (RPi5 headless)
# ─────────────────────────────────────────────────────────────────────────────
# No se asignan a un monitor específico (HEADLESS-N) porque Aquamarine
# puede crear el output como HEADLESS-1, HEADLESS-2, etc. dependiendo de
# cuántos outputs internos creó el backend DRM durante la inicialización.
# Al no fijar el monitor, los workspaces se asignan automáticamente al único
# output disponible (sea cual sea su nombre HEADLESS-N).
# ─────────────────────────────────────────────────────────────────────────────
workspace = 1, default:true
workspace = 2
workspace = 3
workspace = 4
workspace = 5
