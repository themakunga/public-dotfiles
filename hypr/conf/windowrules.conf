# ─────────────────────────────────────────────────────────────────────────────
# Reglas de ventanas
# ─────────────────────────────────────────────────────────────────────────────

# Suprimir maximize en todas las ventanas — el layout master lo gestiona
windowrulev2 = suppressevent maximize, class:.*

# ── Ventanas flotantes ────────────────────────────────────────────────────────
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, title:^(Picture-in-Picture)$

# ── Workspace assignments ─────────────────────────────────────────────────────
# Zen browser siempre en WS3 (class varía según paquete: zen / zen-browser / zen-alpha)
windowrulev2 = workspace 3, class:^(zen|zen-browser|zen-alpha)$

# ── Mascota GLaDOS ────────────────────────────────────────────────────────────
# Ventana siempre flotante, fijada, sin decoración ni foco
windowrulev2 = float,       title:^(glados-mascot)$
windowrulev2 = pin,         title:^(glados-mascot)$
windowrulev2 = nofocus,     title:^(glados-mascot)$
windowrulev2 = noborder,    title:^(glados-mascot)$
windowrulev2 = noshadow,    title:^(glados-mascot)$
windowrulev2 = noblur,      title:^(glados-mascot)$
windowrulev2 = size 440 210,          title:^(glados-mascot)$
windowrulev2 = move 100%-450 100%-220, title:^(glados-mascot)$
