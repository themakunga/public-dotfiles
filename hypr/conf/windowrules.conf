# ─────────────────────────────────────────────────────────────────────────────
# Reglas de ventanas
# ─────────────────────────────────────────────────────────────────────────────

# Suprimir maximize en todas las ventanas — el layout master lo gestiona
windowrule = suppress_event maximize, match:class .*

# ── Ventanas flotantes ────────────────────────────────────────────────────────
windowrule = float on, match:class ^(pavucontrol)$
windowrule = float on, match:class ^(nm-connection-editor)$
windowrule = float on, match:title ^(Picture-in-Picture)$

# ── Workspace assignments ─────────────────────────────────────────────────────
# Zen browser siempre en WS3 (class varía según paquete: zen / zen-browser / zen-alpha)
windowrule = workspace 3, match:class ^(zen|zen-browser|zen-alpha)$

# ── Mascota GLaDOS ────────────────────────────────────────────────────────────
# Ventana siempre flotante, fijada, sin decoración ni foco
windowrule = float on, match:title ^(glados-mascot)$
windowrule = pin on, match:title ^(glados-mascot)$
windowrule = no_focus on, match:title ^(glados-mascot)$
windowrule = border_size 0, match:title ^(glados-mascot)$
windowrule = no_shadow on, match:title ^(glados-mascot)$
windowrule = no_blur on, match:title ^(glados-mascot)$
windowrule = size 440 210, match:title ^(glados-mascot)$
windowrule = move (monitor_w-450) (monitor_h-220), match:title ^(glados-mascot)$
