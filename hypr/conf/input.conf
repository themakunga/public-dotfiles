# ─────────────────────────────────────────────────────────────────────────────
# Configuración de entrada — teclado y ratón
# ─────────────────────────────────────────────────────────────────────────────
input {
  kb_layout     = us
  follow_mouse  = 1
  sensitivity   = 0
  accel_profile = flat

  # Repetición de tecla agresiva — cómodo para navegación vim-style
  repeat_rate   = 35
  repeat_delay  = 200

  touchpad {
    natural_scroll = false
  }
}
