# ─────────────────────────────────────────────────────────────────────────────
# Configuración de monitor — aperture-science (RPi5 headless)
# ─────────────────────────────────────────────────────────────────────────────
# Cliente VNC: iPad Pro 10.5" MPF22LL/A — portrait mode
#
#   Resolución física portrait: 1668 × 2224 px (264 ppi)
#   Resolución lógica (points): 834 × 1112 (2× Retina)
#
# Monitor virtual HEADLESS-1: 1668×2224@60Hz — escala 1:1 exacta
#   - Cada píxel remoto = 1 píxel físico del iPad → sin interpolación
#   - VNC Viewer configurado en zoom 100% (no scale) para resultado perfecto
#   - Nota: ~3.7 MP; asegurarse de buena señal WiFi/Ethernet para fluidez
#
# El output HEADLESS-1 es creado por wayvnc.service en su ExecStartPre.
# ─────────────────────────────────────────────────────────────────────────────

# Catch-all: captura cualquier monitor físico que se conecte en el futuro
monitor = , preferred, auto, 1

# Monitor virtual para VNC — resolución física exacta del iPad Pro 10.5" portrait
monitor = HEADLESS-1, 1668x2224@60, 0x0, 1
