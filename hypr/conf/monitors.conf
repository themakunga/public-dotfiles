# ─────────────────────────────────────────────────────────────────────────────
# Configuración de monitor — aperture-science (RPi5)
# ─────────────────────────────────────────────────────────────────────────────
# Un solo escritorio visible en todo momento.
# VNC (wayvnc) captura HDMI-A-1 directamente — no se crea output headless.
