# ─────────────────────────────────────────────────────────────────────────────
# Configuración de monitor — aperture-science (RPi5 headless)
# ─────────────────────────────────────────────────────────────────────────────
# Cliente VNC: iPad Pro 10.5" MPF22LL/A — landscape mode
#
#   Resolución física landscape: 2224 × 1668 px (264 ppi)
#   Resolución lógica (points): 1112 × 834 (2× Retina)
#
# Aquamarine (backend de Hyprland) puede crear el output virtual con nombre
# HEADLESS-1, HEADLESS-2, etc. dependiendo de cuántos outputs internos
# transitoriamente creó el backend DRM durante la inicialización.
# Por eso usamos la regla catch-all (monitor = ,…) en vez de HEADLESS-1 fijo:
#   - Se aplica a cualquier HEADLESS-N que sea el output activo
#   - Si se conecta un HDMI físico también obtiene 1668×2224 (modo portrait);
#     wayvnc sirve el HEADLESS, no el HDMI
#
# El output HEADLESS-N es creado por wayvnc.service (ExecStartPre) si Aquamarine
# no lo creó ya como fallback al no encontrar displays físicos conectados.
# ─────────────────────────────────────────────────────────────────────────────

# Catch-all: resolución iPad Pro 10.5" landscape para cualquier output
monitor = , 2224x1668@60, auto, 1
