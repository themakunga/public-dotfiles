# Monitor físico Samsung S24F350: resolución nativa 1920×1080
monitor = HDMI-A-1, 1920x1080@60, 0x0, 1

# Deshabilitar cualquier otra salida (outputs headless de Aquamarine, etc.)
monitor = , disabled
