# ─────────────────────────────────────────────────────────────────────────────
# Apariencia — decoración, animaciones y layout
# ─────────────────────────────────────────────────────────────────────────────

# ── Decoración de ventanas ────────────────────────────────────────────────────
decoration {
  rounding       = 10
  rounding_power = 2
  active_opacity   = 1.0
  inactive_opacity = 0.92

  # Desactivado para conservar GPU del RPi5 (VideoCore 7)
  drop_shadow = false
  blur {
    enabled = false
  }
}

# ── Animaciones ───────────────────────────────────────────────────────────────
# OFF — el RPi5 no tiene potencia de sobra para efectos en VNC
animations {
  enabled = false
}

# ── Layout master (tiling principal) ─────────────────────────────────────────
master {
  new_status = "master"
}
