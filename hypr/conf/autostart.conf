# ─────────────────────────────────────────────────────────────────────────────
# Autostart — servicios que requieren el compositor activo
# ─────────────────────────────────────────────────────────────────────────────
# wayvnc se gestiona vía systemd path unit (hyprland-desktop.nix):
#   wayvnc.path detecta wayland-1 → inicia wayvnc.service automáticamente.
#
# swww/awww: se lanza aquí (exec-once) porque graphical-session.target
# no se activa correctamente en nuestro setup greetd+dbus-run-session.
# awww-daemon debe arrancar antes de que awww img pueda enviar la imagen.
# ─────────────────────────────────────────────────────────────────────────────

# Barra de estado
exec-once = waybar

# Local voice dictation; the compositor owns its global shortcut.
exec-once = handy --start-hidden

# Wallpaper daemon (awww = swww renombrado en nixpkgs 26.05)
exec-once = /run/current-system/sw/bin/awww-daemon

# Aplicar wallpaper 3 segundos después (tiempo para que el daemon inicialice)
exec-once = sleep 3 && /run/current-system/sw/bin/awww img ~/.config/wallpapers/aperture-science.jpg --transition-type none

# ── Workspace assignments ────────────────────────────────────────────────────
# WS1: Wheatley starts fullscreen and reattaches to the same tmux session.
exec-once = [workspace 1; fullscreen on] sh -c '[ "$USER" = wheatley ] && exec wezterm start --always-new-process -- tmux new-session -A -s main'

# Preserve the existing terminal layout for other users.
exec-once = [workspace 1 silent] sh -c '[ "$USER" != wheatley ] && exec wezterm'
exec-once = [workspace 1 silent] sh -c '[ "$USER" != wheatley ] && exec wezterm'

# WS2: Secondary terminal for other desktop users.
exec-once = [workspace 2 silent] sh -c '[ "$USER" != wheatley ] && exec wezterm'

# WS3: Navegador Zen
exec-once = [workspace 3 silent] zen

# ── Mascota GLaDOS ────────────────────────────────────────────────────────────
# Ventana flotante en esquina inferior derecha — siempre visible, sin foco
exec-once = [float on;size 440 210;move (monitor_w-450) (monitor_h-220)] wezterm start --always-new-process -- bash /opt/glados/mascot.sh
