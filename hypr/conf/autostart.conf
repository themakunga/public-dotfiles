# ─────────────────────────────────────────────────────────────────────────────
# Autostart — servicios que requieren el compositor activo
# ─────────────────────────────────────────────────────────────────────────────
# wayvnc se gestiona vía systemd path unit (hyprland-desktop.nix):
#   wayvnc.path detecta wayland-1 → inicia wayvnc.service automáticamente.
#
# swww/awww: se lanza aquí (exec-once) porque graphical-session.target
# no se activa correctamente en nuestro setup greetd+dbus-run-session.
# awww-daemon debe arrancar antes de que awww img pueda enviar la imagen.
# ─────────────────────────────────────────────────────────────────────────────

# Barra de estado
exec-once = waybar

# Wallpaper daemon (awww = swww renombrado en nixpkgs 26.05)
exec-once = /run/current-system/sw/bin/awww-daemon

# Aplicar wallpaper 3 segundos después (tiempo para que el daemon inicialice)
exec-once = sleep 3 && /run/current-system/sw/bin/awww img ~/.config/wallpapers/aperture-science.jpg --transition-type none
