# ═════════════════════════════════════════════════════════════════════════════
# Hyprland — aperture-science (Raspberry Pi 5)
# Tema:      TokyoNight Storm
# VNC:       1920×1440 (4:3, optimizado para iPad Pro 10.5")
#
# Config factorizada en submódulos bajo conf/ para facilitar mantenimiento.
# Edita el archivo correspondiente a cada área; no es necesario hacer rebuild
# de NixOS — los cambios se reflejan al recargar Hyprland (SUPER+SHIFT+Q
# seguido de re-login, o `hyprctl reload`).
# ═════════════════════════════════════════════════════════════════════════════

# ── 1. Paleta de colores (TokyoNight Storm) ───────────────────────────────────
source = ~/.config/hypr/conf/colors.conf

# ── 2. Monitor virtual para VNC ──────────────────────────────────────────────
source = ~/.config/hypr/conf/monitors.conf

# ── 3. Entrada (teclado, ratón) ───────────────────────────────────────────────
source = ~/.config/hypr/conf/input.conf

# ── 4. Apariencia (decoración, animaciones, layout) ──────────────────────────
source = ~/.config/hypr/conf/appearance.conf

# ── 5. Atajos de teclado ──────────────────────────────────────────────────────
source = ~/.config/hypr/conf/keybindings.conf

# ── 6. Reglas de ventanas ─────────────────────────────────────────────────────
source = ~/.config/hypr/conf/windowrules.conf

# ── 7. Workspaces ─────────────────────────────────────────────────────────────
source = ~/.config/hypr/conf/workspaces.conf

# ── 8. Autostart ──────────────────────────────────────────────────────────────
source = ~/.config/hypr/conf/autostart.conf

# ─────────────────────────────────────────────────────────────────────────────
# General — usa variables de colors.conf
# ─────────────────────────────────────────────────────────────────────────────
general {
  layout           = master
  gaps_in          = 4
  gaps_out         = 8
  border_size      = 2
  col.active_border   = $color_blue $color_magenta 45deg
  col.inactive_border = $color_bg_highlight
  resize_on_border    = true
}

# ─────────────────────────────────────────────────────────────────────────────
# Misc
# ─────────────────────────────────────────────────────────────────────────────
misc {
  disable_hyprland_logo   = true
  force_default_wallpaper = 0
  # Variable Frame Rate: duerme el compositor cuando no hay cambios (ahorro RPi5)
  vfr                     = true
}

# ─────────────────────────────────────────────────────────────────────────────
# Cursor
# ─────────────────────────────────────────────────────────────────────────────
cursor {
  enable_hyprcursor   = false
  no_hardware_cursors = true
}

# ─────────────────────────────────────────────────────────────────────────────
# Variables globales
# ─────────────────────────────────────────────────────────────────────────────
$terminal = foot
$launcher  = wofi --show drun --allow-images
